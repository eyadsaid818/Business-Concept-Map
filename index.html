<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motivation Theories Map</title>
<meta name="description" content="A 3D concept map of Taylor, Maslow and Herzberg's motivation theories for IB Business Management, Unit 2.4.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* A drafting sheet at night: Prussian-blue blueprint paper, chalk linework,
   three pencil colours for the three theories. */
:root {
  --paper: #0f2643;
  --paper-2: #143152;
  --rule: rgba(169, 190, 210, 0.22);
  --rule-strong: rgba(169, 190, 210, 0.45);
  --chalk: #e9f0f5;
  --chalk-2: #a9bed2;
  --chalk-3: #86a0ba;
  --taylor: #efa94a;
  --maslow: #ff806a;
  --herzberg: #5fd6c6;
  --tip: #ffd76a;
  --display: "Big Shoulders Display", "Arial Narrow", sans-serif;
  --body: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", sans-serif;
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
* { margin: 0; }
html, body { height: 100%; }
body {
  background: var(--paper);
  color: var(--chalk);
  font: 400 1rem/1.55 var(--body);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  caret-color: var(--tip);
}
::selection { background: rgba(255, 215, 106, 0.35); color: #fff; }
:focus-visible { outline: 2px solid var(--tip); outline-offset: 3px; border-radius: 3px; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
svg.i { width: 1.1em; height: 1.1em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ── Sheet ── */
.sheet { position: relative; height: 100svh; display: grid; grid-template-rows: 1fr auto; }
.head {
  position: absolute; z-index: 2; top: 0; left: 0; right: 0; pointer-events: none;
  display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem 3rem;
  padding: clamp(1.25rem, 3vw, 2.25rem) clamp(1rem, 3vw, 2.25rem) 0;
}
.head h1 { font: 800 clamp(2.5rem, 5vw, 4.5rem)/0.9 var(--display); max-width: 13ch; text-wrap: balance; }
.head p { max-width: 36ch; padding-top: 0.5rem; color: var(--chalk-2); font-size: 0.98rem; }
.stage { position: relative; overflow: hidden; touch-action: pan-y; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
.stage canvas.dragging { cursor: grabbing; }
.stage canvas.pointing { cursor: pointer; }
.labels { position: absolute; inset: 0; pointer-events: none; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--chalk-3); }

/* Node labels: lettering on the drawing */
.nl {
  position: absolute; left: 0; top: 0; pointer-events: auto; will-change: transform, opacity;
  display: grid; justify-items: center; text-align: center; white-space: nowrap;
  padding: 0.35rem 0.55rem; opacity: 0;
  color: var(--chalk-2); font-size: 0.82rem; line-height: 1.2;
  text-shadow: 0 0 6px var(--paper), 0 0 3px var(--paper), 0 0 1px var(--paper);
  transition: color 0.2s;
}
.nl:hover, .nl.is-hot { color: #fff; }
.nl .t { font-weight: 600; }
.nl .s { font-size: 0.74rem; color: var(--chalk-3); }
.nl.k-theory .t { font: 800 1.9rem/0.95 var(--display); color: var(--c); }
.nl.k-theory .s { font-size: 0.8rem; color: var(--chalk-2); margin-top: 0.15rem; }
.nl.k-core .t { font: 800 1.6rem/1 var(--display); color: var(--chalk); }
.nl.k-level { color: var(--chalk); font-size: 0.8rem; }
.nl.k-level .t { font-weight: 700; }
.nl.k-tip { color: var(--tip); }
.nl.k-tip .t::before {
  content: ""; display: inline-block; width: 6px; height: 6px; margin-right: 0.45rem; vertical-align: 0.15em;
  border: 1.5px solid var(--tip); transform: rotate(45deg);
}
.nl.at-left { justify-items: end; text-align: right; }
.nl.is-sel .t { text-decoration: underline; text-decoration-color: var(--c, var(--chalk)); text-decoration-thickness: 2px; text-underline-offset: 0.25em; }
.ph {
  position: absolute; left: 0; top: 0; pointer-events: none; white-space: nowrap; opacity: 0;
  font-style: italic; font-size: 0.76rem; color: var(--chalk-2); will-change: transform, opacity;
  text-shadow: 0 0 6px var(--paper), 0 0 3px var(--paper);
}

/* Notes panel */
.notes {
  position: absolute; z-index: 5; top: 1rem; right: 1rem; bottom: 1rem; width: min(400px, calc(100% - 2rem));
  display: flex; flex-direction: column; gap: 0.9rem; padding: 1.25rem 1.4rem 1.5rem; overflow: auto; overscroll-behavior: contain;
  background: var(--paper-2); border: 1px solid var(--rule-strong); border-radius: 6px;
  transform: translateX(calc(100% + 2rem)); visibility: hidden;
  transition: transform 0.45s var(--ease-out), visibility 0s 0.45s;
}
.notes.open { transform: none; visibility: visible; transition: transform 0.45s var(--ease-out), visibility 0s; }
.notes-top { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
.notes-theory { font-size: 0.85rem; color: var(--chalk-2); }
.notes-theory b { color: var(--c); font-weight: 700; }
.close { display: grid; place-items: center; width: 44px; height: 44px; margin: -0.6rem -0.75rem -0.6rem 0; border-radius: 4px; color: var(--chalk-2); }
.close:hover { color: #fff; background: rgba(169, 190, 210, 0.12); }
.notes h2 { font: 800 2.15rem/0.95 var(--display); color: var(--c, var(--chalk)); outline: none; }
.notes-body { color: var(--chalk-2); display: grid; gap: 0.75rem; }
.notes-body b { color: var(--chalk); font-weight: 700; }
.notes-body ul { padding-left: 1.1rem; display: grid; gap: 0.35rem; }
.notes-body blockquote { color: var(--chalk); font-style: italic; padding-left: 0.9rem; border-left: 1px solid var(--c, var(--chalk)); }
.notes-body .chips { display: flex; flex-wrap: wrap; gap: 0.35rem 0.4rem; }
.chip-s { font-size: 0.82rem; padding: 0.15rem 0.55rem; border: 1px solid var(--rule-strong); border-radius: 3px; color: var(--chalk); }
.links { display: grid; padding-top: 0.75rem; border-top: 1px solid var(--rule); }
.links h3 { font-size: 0.85rem; font-weight: 600; color: var(--chalk-3); margin-bottom: 0.3rem; }
.links button { text-align: left; display: flex; align-items: baseline; gap: 0.6rem; min-height: 40px; padding: 0.4rem 0.5rem; margin: 0 -0.5rem; border-radius: 4px; color: var(--chalk-2); font-size: 0.94rem; }
.links button:hover { background: rgba(169, 190, 210, 0.1); color: #fff; }
.links button .sw { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; transform: translateY(-1px); }
.links button em { font-size: 0.82rem; color: var(--chalk-3); margin-left: auto; padding-left: 0.75rem; }

/* Bottom strip: the drawing's title block */
.strip {
  display: flex; align-items: center; gap: 0.5rem 2rem; flex-wrap: wrap;
  padding: 0.5rem clamp(1rem, 3vw, 2.25rem);
  background: var(--paper); border-top: 1px solid var(--rule-strong);
}
.views { display: flex; gap: 0.25rem; }
.views button {
  position: relative; min-height: 44px; padding: 0.4rem 0.7rem; font-size: 0.95rem; color: var(--chalk-2);
  transition: color 0.2s;
}
.views button:hover { color: #fff; }
.views button::after {
  content: ""; position: absolute; left: 0.7rem; right: 0.7rem; bottom: 0.45rem; height: 2px;
  background: var(--c, var(--chalk)); transform: scaleX(0); transform-origin: left; transition: transform 0.3s var(--ease-out);
}
.views button[aria-pressed="true"] { color: var(--chalk); }
.views button[aria-pressed="true"]::after { transform: scaleX(1); }
.key { display: flex; gap: 1.25rem; font-size: 0.82rem; color: var(--chalk-3); margin-left: auto; }
.key span { display: inline-flex; align-items: center; gap: 0.5rem; }
.key i { display: inline-block; width: 22px; border-top: 2px solid var(--chalk-2); }
.key i.d { border-top-style: dashed; }
body:not(.tips-on) .key .tipkey { display: none; }
.key .tipkey i { width: 7px; height: 7px; border: 1.5px solid var(--tip); transform: rotate(45deg); }
.switch {
  display: inline-flex; align-items: center; gap: 0.6rem; min-height: 44px; padding: 0.4rem 0;
  font-size: 0.95rem; color: var(--chalk-2);
}
.switch:hover { color: #fff; }
.switch .track { position: relative; width: 34px; height: 18px; border-radius: 18px; border: 1.5px solid var(--chalk-3); transition: border-color 0.2s, background-color 0.2s; }
.switch .track::after {
  content: ""; position: absolute; top: 2px; left: 2px; width: 11px; height: 11px; border-radius: 50%;
  background: var(--chalk-3); transition: transform 0.25s var(--ease-out), background-color 0.2s;
}
.switch[aria-checked="true"] { color: var(--chalk); }
.switch[aria-checked="true"] .track { border-color: var(--tip); }
.switch[aria-checked="true"] .track::after { transform: translateX(16px); background: var(--tip); }

/* Fallback list when 3D is unavailable */
.fallback { position: absolute; inset: 0; overflow: auto; display: none; gap: 2rem; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); align-content: start; padding: 11rem clamp(1rem, 3vw, 2.25rem) 2rem; }
.stage.is-fallback .fallback { display: grid; }
.stage.is-fallback canvas, .stage.is-fallback .labels { display: none; }
.fallback h3 { font: 800 1.8rem/1 var(--display); color: var(--c); margin-bottom: 0.5rem; }
.fallback button { display: block; width: 100%; min-height: 44px; text-align: left; padding: 0.5rem 0; color: var(--chalk-2); border-bottom: 1px solid var(--rule); }
.fallback button:hover { color: #fff; }
.fallback .note { grid-column: 1 / -1; color: var(--chalk-2); }

@media (max-width: 820px) {
  body { overflow: auto; }
  .sheet { grid-template-rows: auto 1fr auto; }
  .head { position: static; flex-direction: column; gap: 0.6rem; padding-bottom: 0.25rem; }
  .head p { padding-top: 0; font-size: 0.94rem; }
  .stage { min-height: 380px; }
  .notes { top: auto; left: 0.5rem; right: 0.5rem; bottom: 0.5rem; width: auto; max-height: 50%; transform: translateY(calc(100% + 1rem)); }
  .key { display: none; }
  .strip { justify-content: space-between; gap: 0 1rem; padding: 0.25rem 0.75rem; }
  .views button { padding: 0.4rem 0.5rem; font-size: 0.9rem; }
  .views button::after { left: 0.5rem; right: 0.5rem; }
  .nl { font-size: 0.74rem; padding: 0.3rem 0.4rem; }
  .nl .s { font-size: 0.68rem; }
  .nl.k-theory .t { font-size: 1.45rem; }
  .nl.k-core .t { font-size: 1.25rem; }
  .nl.k-core .s { display: none; }
  .nl.k-level { font-size: 0.7rem; }
  .fallback { padding-top: 1rem; }
}
@media (max-width: 420px) {
  .views .whole-long { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
}
</style>
</head>
<body class="tips-on">

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
</svg>

<main class="sheet">
  <header class="head">
    <h1>What motivates people at work?</h1>
    <p>Three answers from IB Business Management, Unit 2.4. Drag to turn the drawing; select any idea to read its notes.</p>
  </header>

  <div class="stage" id="stage">
    <canvas id="mapCanvas" aria-hidden="true"></canvas>
    <div class="labels" id="labels"></div>
    <div class="loading" id="mapLoading">Drawing the map…</div>
    <div class="fallback" id="fallback"></div>
    <aside class="notes" id="notes" aria-labelledby="notesTitle" inert>
      <div class="notes-top">
        <span class="notes-theory" id="notesTheory"></span>
        <button class="close" id="notesClose" type="button" aria-label="Close notes"><svg class="i"><use href="#i-x"/></svg></button>
      </div>
      <h2 id="notesTitle" tabindex="-1"></h2>
      <div class="notes-body" id="notesBody"></div>
      <div class="links" id="notesLinks"></div>
    </aside>
  </div>

  <footer class="strip">
    <div class="views" role="group" aria-label="Show part of the map">
      <button type="button" data-focus="" aria-pressed="true">All<span class="whole-long"> three</span></button>
      <button type="button" data-focus="taylor" aria-pressed="false" style="--c:var(--taylor)">Taylor</button>
      <button type="button" data-focus="maslow" aria-pressed="false" style="--c:var(--maslow)">Maslow</button>
      <button type="button" data-focus="herzberg" aria-pressed="false" style="--c:var(--herzberg)">Herzberg</button>
    </div>
    <div class="key" aria-label="Map key">
      <span><i></i>Part of a theory</span>
      <span><i class="d"></i>Link between theories</span>
      <span class="tipkey"><i></i>Exam tip</span>
    </div>
    <button class="switch" id="tipsToggle" type="button" role="switch" aria-checked="true"><span class="track" aria-hidden="true"></span>Exam tips</button>
  </footer>
</main>

<script>
/* ═══════════════ CONTENT (only from the supplied notes) ═══════════════ */
const THEORY = {
  taylor:   { name: 'Taylor',   full: 'F.W. Taylor',   title: 'Scientific management', year: '1911', color: '#efa94a', css: 'var(--taylor)' },
  maslow:   { name: 'Maslow',   full: 'A. Maslow',     title: 'Hierarchy of needs',   year: '1943', color: '#ff806a', css: 'var(--maslow)' },
  herzberg: { name: 'Herzberg', full: 'F. Herzberg',   title: 'Two-factor theory',    year: '1959', color: '#5fd6c6', css: 'var(--herzberg)' }
};

const LEVELS = [
  { n: 1, id: 'm1', name: 'Physiological needs', aka: 'basic needs', s: 'Survival', order: 'Lower-order',
    def: 'The requirements for human survival: the combination of people’s physical and biological needs, irrespective of age, race, social-economic status, and other factors. These are the essential things all human beings must have in order to survive, such as food, clothing and shelter. They are so significant that they must be met first.',
    work: 'Improved financial reward systems and working conditions can help people to meet these basic needs.',
    ex: ['Basic necessities', 'Biological needs', 'Pay', 'Survival'] },
  { n: 2, id: 'm2', name: 'Safety needs', aka: 'security needs', s: 'Security', order: 'Lower-order',
    def: 'The requirements that make people feel safe, such as job security.',
    work: 'In a business context, this means the assurance given to employees that they will keep their current job for the foreseeable future. Job security depends on a worker’s performance, the financial success of the business, employment legislation and the current economic climate. Firms can address safety needs, to some extent, by using contracts of employment.',
    ex: ['Job security', 'Predictability', 'Stability', 'Steady job'] },
  { n: 3, id: 'm3', name: 'Social needs', aka: 'love and belonging needs', s: 'Social', order: 'Lower-order',
    def: 'The requirements about being accepted by others.',
    work: 'In the workplace, social needs can be met by creating opportunities for team working and having social facilities or functions. A mentoring or coaching system can also help to improve working relationships.',
    ex: ['Acceptance', 'Affection', 'Fitting in', 'Friendship', 'Group identity'] },
  { n: 4, id: 'm4', name: 'Esteem needs', aka: null, s: 'Self-esteem', order: 'Higher-order',
    def: 'The desire of people to feel respected, having value and having self-respect. Intrinsically, self-esteem exists when people are able to feel good about themselves, as they feel valued by others.',
    work: 'Extrinsically, esteem needs can be met by genuine recognition, acknowledgement, trust and respect from others.',
    quote: ['Outstanding leaders go out of their way to boost the self-esteem of their personnel. If people believe in themselves, it’s amazing what they can accomplish.', 'Sam Walton (1918–1992), founder of Walmart'],
    ex: ['Achievement', 'Reputation', 'Respect', 'Responsibilities', 'Status'] },
  { n: 5, id: 'm5', name: 'Self-actualization', aka: null, s: 'Self-actualization', order: 'Higher-order',
    def: 'Occurs when people become the very best that they can be, fulfilling their full potential. In Maslow’s words, “What a man can be, he must be” and “to become everything that one is capable of becoming.”',
    work: 'Being the highest level in the hierarchy, self-actualization exists when a person is able to fulfil their true potential.',
    quote: ['When you love what you do, you’ll never have to work a day in your life.', 'Steve Ackerie, American entrepreneur'],
    ex: ['Accomplishment', 'Develop fully', 'Fulfil potential', 'Personal growth'] }
];

const HYGIENE = ['Company policies', 'Conditions of employment', 'Job security', 'Pay (wages and salaries)', 'Relationship with colleagues', 'Relationship with management', 'Status', 'Supervision', 'Treatment at work', 'Working environment'];
const MOTIVATORS = ['Achievement', 'Advancement', 'Challenging work', 'Decision making', 'Nature of the job', 'Opportunities to improve', 'Personal growth', 'Purpose', 'Recognition (of achievement)', 'Responsibility'];

const levelBody = (L) => `
  <p>${L.aka ? `Also known as <b>${L.aka}</b>. ` : ''}<b>${L.order} need.</b></p>
  <p>${L.def}</p><p>${L.work}</p>
  ${L.quote ? `<blockquote>“${L.quote[0]}” <br><span style="font-style:normal;color:var(--chalk-3);font-size:.85rem">${L.quote[1]}</span></blockquote>` : ''}
  <div class="chips">${L.ex.map(e => `<span class="chip-s">${e}</span>`).join('')}</div>`;

/* Concept map nodes. pos = [x, y, z] in scene units. */
const NODES = [
  { id: 'core', kind: 'core', label: 'Motivation', sub: 'Theories in HR, Unit 2.4', pos: [0, 7.5, 0], section: 'summary',
    body: `<p>The IB Business Management syllabus covers three motivation theories in HR. Each gives a different answer to what motivates people at work.</p>
      <ul><li><b>Taylor</b> (1911): financial incentives, efficiency and control.</li><li><b>Maslow</b> (1943): a hierarchy of five needs.</li><li><b>Herzberg</b> (1959): hygiene factors and motivators.</li></ul>` },

  { id: 'taylor', kind: 'theory', theory: 'taylor', label: 'Taylor', sub: 'Scientific management, 1911', pos: [-9.6, 0.6, 0.5], section: 'taylor',
    body: `<p>Frederick Winslow Taylor (1856–1917) was an American engineer and management consultant who aimed to make efficiency gains and raise productivity levels. He is often regarded as the father of motivation theory.</p>
      <p>In <i>The Principles of Scientific Management</i> (1911) he argued for a <b>command and control</b> approach, and that the main reason people work is <b>money</b>.</p>` },
  { id: 't-sci', kind: 'idea', theory: 'taylor', label: 'Measure, monitor, control', pos: [-13.0, 3.0, -0.6], section: 'taylor',
    body: `<p>Taylor believed in measuring, monitoring and controlling efficiency and productivity levels in the workplace.</p>
      <p>He studied tasks systematically, breaking them into smaller steps to find the most efficient method. His principles stress a clear <b>division of labour</b>, assigning tasks based on workers’ skills to raise productivity and job satisfaction.</p>
      <p>The approach focused on standardized tasks and strict management control.</p>` },
  { id: 't-cmd', kind: 'idea', theory: 'taylor', label: 'Command and control', pos: [-13.7, -0.9, 0.6], section: 'taylor',
    body: `<blockquote>Entrepreneurs “do not want any initiative” but “them to obey the orders we give.”</blockquote>
      <p>Managers and business owners only sought <b>obedience</b> from their workers, who follow the orders given to them.</p>
      <p>Workers are seen as tools for efficiency rather than individuals with diverse needs.</p>` },
  { id: 't-pay', kind: 'idea', theory: 'taylor', label: 'Differentiated piece rate', pos: [-6.9, -2.7, 1.4], section: 'taylor',
    body: `<blockquote>“What the workmen want from employers beyond anything else is higher wages.”</blockquote>
      <p>There should be a higher financial reward for more hard-working and productive workers. Differentiated piece rate (differentiated compensation) rewards those who meet or exceed targets.</p>
      <p><b>Example:</b> up to 100 units are paid at $3 per unit, rising to $4 per unit for each item made above 100 units.</p>` },
  { id: 't-rest', kind: 'idea', theory: 'taylor', label: 'Rest breaks', pos: [-11.6, -3.7, 1.6], section: 'taylor',
    body: `<p>Scientific management does not only encourage people to work hard. Taylor introduced rest breaks so workers could recover from exhaustion, which would otherwise reduce productivity.</p>
      <p>Beyond money, Taylor emphasized management’s role in training, supporting workers, and improving working conditions. He is credited with significant improvements in health and safety.</p>` },
  { id: 't-lim', kind: 'idea', theory: 'taylor', label: 'Limitations', pos: [-6.7, 3.3, -0.8], section: 'taylor',
    body: `<ul><li>Rather authoritarian, and perhaps less suitable in modern businesses of the 21st century.</li>
      <li>Maslow and Herzberg felt there is far more to motivation than money. People are not motivated in the same way, so differentiated piece rates do not suit all individuals or organizations.</li>
      <li>Qualitative factors affecting motivation are largely ignored; limited in addressing non-financial motivators.</li></ul>` },

  { id: 'maslow', kind: 'theory', theory: 'maslow', label: 'Maslow', sub: 'Hierarchy of needs, 1943', pos: [0, 3.05, -2], labelAt: 'left', section: 'maslow',
    body: `<p>Abraham Maslow (1908–1970) was an American social psychologist. His hierarchy of needs explains how people are motivated by different levels of needs.</p>
      <p>Needs are people’s unfulfilled physiological and/or psychological desires. Only when one level is met can the next level be addressed, and a need that is satisfied no longer motivates.</p>` },
  ...LEVELS.map(L => ({ id: L.id, kind: 'level', theory: 'maslow', level: L.n, label: L.name, section: 'maslow', body: levelBody(L) })),
  { id: 'm-lower', kind: 'idea', theory: 'maslow', label: 'Lower-order needs', sub: 'deficiency needs', pos: [4.6, -1.75, -2], section: 'maslow',
    body: `<p>Physiological, safety, and social (love and belonging) needs. These must be met to <b>prevent dissatisfaction</b> or unhappiness, for example food and job security.</p>` },
  { id: 'm-higher', kind: 'idea', theory: 'maslow', label: 'Higher-order needs', sub: 'growth needs', pos: [4.6, 1.1, -2], section: 'maslow',
    body: `<p>Esteem and self-actualization needs. Meeting them helps provide a genuine sense of being complete, contented and overjoyed. They provide <b>deeper motivation</b>, for example recognition and personal growth.</p>` },
  { id: 'm-crit', kind: 'idea', theory: 'maslow', label: 'Criticisms', pos: [-4.5, 0.3, -2], section: 'maslow',
    body: `<ul><li>People are not necessarily motivated in the same way, so the levels do not apply to everyone in all contexts.</li>
      <li>Not everyone is motivated by promotion, even though it is linked to esteem needs. Some people prefer to work alone rather than in a team.</li>
      <li>For most people it is probably unrealistic to ever reach self-actualization.</li></ul>` },

  { id: 'herzberg', kind: 'theory', theory: 'herzberg', label: 'Herzberg', sub: 'Two-factor theory, 1959', pos: [9.6, 0.6, 0.5], section: 'herzberg',
    body: `<p>Professor Frederick Herzberg (1923–2000) was an American psychologist. In <i>Work and Nature of Man</i> (1966) he argued that to create any motivation, it was essential to <b>first remove the factors that cause dissatisfaction</b>.</p>
      <p>Factors split into two categories: <b>hygiene factors</b> and <b>motivators</b>.</p>` },
  { id: 'h-hyg', kind: 'idea', theory: 'herzberg', label: 'Hygiene factors', sub: 'maintenance factors', pos: [7.7, -3.4, 1.4], section: 'herzberg',
    body: `<p>Also called maintenance factors or job dissatisfiers. These are lower-level needs, met in order to meet physiological needs.</p>
      <p>Improving them simply <b>prevents dissatisfaction</b> but does not boost morale or motivation. The working environment is a hygiene factor that must be addressed to prevent dissatisfaction.</p>
      <div class="chips">${HYGIENE.map(e => `<span class="chip-s">${e}</span>`).join('')}</div>` },
  { id: 'h-mot', kind: 'idea', theory: 'herzberg', label: 'Motivators', sub: 'growth factors', pos: [7.5, 3.4, -0.8], section: 'herzberg',
    body: `<blockquote>Motivation is “the will to work, due to enjoyment of the work itself”.</blockquote>
      <p>Also called growth factors. These are higher-level needs, met in order to meet psychological needs. They lead to <b>job satisfaction and psychological growth</b>.</p>
      <div class="chips">${MOTIVATORS.map(e => `<span class="chip-s">${e}</span>`).join('')}</div>` },
  { id: 'h-pay', kind: 'idea', theory: 'herzberg', label: 'Pay is a hygiene factor', pos: [11.8, -3.7, 1.6], section: 'herzberg',
    body: `<p>Herzberg considered wages and salaries to be hygiene factors, because all workers expect pay for their input in the production process.</p>
      <p>Unlike Taylor, he suggested that satisfaction does not come from extrinsic factors such as pay, because these become the norm as an expectation. It takes more than wages and salaries to keep workers satisfied.</p>` },
  { id: 'h-work', kind: 'idea', theory: 'herzberg', label: 'The work itself', pos: [13.1, 3.0, -0.6], section: 'herzberg',
    body: `<p>The work itself (the nature of the job) provides workers with opportunities for psychological growth.</p>
      <p>Motivation occurs by enhancing motivators, such as recognition, responsibilities, and opportunities for personal advancement. Jobs should be designed to include opportunities for advancement, responsibility, and achievement.</p>` },

  { id: 'tip-auto', kind: 'tip', tip: true, theory: 'taylor', label: 'Autocratic leadership', sub: 'Unit 2.3', pos: [-14.8, -4.5, 0.8], section: 'taylor',
    body: `<p><b>Top tip 1.</b> Make links between topics in the syllabus. F.W. Taylor’s theory of scientific management (Unit 2.4) works best under an autocratic leadership style (Unit 2.3).</p>` },
  { id: 'tip-mistake', kind: 'tip', tip: true, theory: 'taylor', label: 'Common mistake', pos: [-9.9, 5.0, -1.2], section: 'taylor',
    body: `<p>Many students assume Taylor’s theory is simply that “money motivates.” This is an overly simplistic view.</p>
      <p>Taylor’s theory is about improving workplace efficiency and productivity through scientific management: breaking tasks into smaller steps, a clear division of labour, and management’s role in training, supporting workers, and improving working conditions.</p>` },
  { id: 'tip-5s', kind: 'tip', tip: true, theory: 'maslow', label: 'The 5S model', pos: [-4.6, 5.5, -1.8], section: 'maslow',
    body: `<p><b>Top tip 3.</b> All the levels can be remembered with the letter S: <b>Survival</b>, <b>Security</b>, <b>Social</b>, <b>Self-esteem</b> and <b>Self-actualization</b>.</p>
      <p style="font-size:.85rem;color:var(--chalk-3)">Source: Business Management for the IB Diploma, IBID Press, 5th edn</p>` },
  { id: 'tip-esteem', kind: 'tip', tip: true, theory: 'maslow', label: 'Internal vs external esteem', pos: [4.1, 4.45, -2], section: 'maslow',
    body: `<p><b>Top tip 2.</b> <b>Internal</b> esteem needs: achievement and self-confidence, e.g. meeting or exceeding personal goals at work.</p>
      <p><b>External</b> esteem needs: respect and recognition from others, e.g. job titles, praise, “employee of the month” schemes, training, and promotions.</p>` }
];

/* type: 'tree' (part of a theory), 'cross' (link between theories), 'tip', 'hidden' (logical only) */
const EDGES = [
  { a: 'core', b: 'taylor', type: 'tree', phrase: 'explained by', ctrl: [-5.8, 7.6, 0.8] },
  { a: 'core', b: 'maslow', type: 'tree' },
  { a: 'core', b: 'herzberg', type: 'tree', phrase: 'explained by', ctrl: [5.8, 7.6, 0.8] },
  { a: 'taylor', b: 't-sci', type: 'tree' }, { a: 'taylor', b: 't-cmd', type: 'tree' }, { a: 'taylor', b: 't-pay', type: 'tree' },
  { a: 'taylor', b: 't-rest', type: 'tree' }, { a: 'taylor', b: 't-lim', type: 'tree' },
  { a: 'maslow', b: 'm-crit', type: 'tree', ctrl: [-3.4, 2.6, -1.6] },
  { a: 'm-lower', b: 'm1', type: 'hidden' }, { a: 'm-lower', b: 'm2', type: 'hidden' }, { a: 'm-lower', b: 'm3', type: 'hidden' },
  { a: 'm-higher', b: 'm4', type: 'hidden' }, { a: 'm-higher', b: 'm5', type: 'hidden' },
  { a: 'maslow', b: 'm1', type: 'hidden' }, { a: 'maslow', b: 'm2', type: 'hidden' }, { a: 'maslow', b: 'm3', type: 'hidden' },
  { a: 'maslow', b: 'm4', type: 'hidden' }, { a: 'maslow', b: 'm5', type: 'hidden' },
  { a: 'maslow', b: 'm-lower', type: 'hidden' }, { a: 'maslow', b: 'm-higher', type: 'hidden' },
  { a: 'herzberg', b: 'h-hyg', type: 'tree' }, { a: 'herzberg', b: 'h-mot', type: 'tree' }, { a: 'herzberg', b: 'h-pay', type: 'tree' }, { a: 'herzberg', b: 'h-work', type: 'tree' },
  { a: 't-pay', b: 'm1', type: 'cross', phrase: 'pay also meets', ctrl: [-3.6, -3.6, 1.2] },
  { a: 't-pay', b: 'h-pay', type: 'cross', phrase: 'they disagree on pay', ctrl: [2.4, -9.4, 3.2] },
  { a: 'm-lower', b: 'h-hyg', type: 'cross', phrase: 'both prevent dissatisfaction', ctrl: [9.45, -1.8, -0.1] },
  { a: 'm-higher', b: 'h-mot', type: 'cross', phrase: 'both drive deeper motivation', ctrl: [6.75, 0.95, -1.0] },
  { a: 'taylor', b: 'tip-auto', type: 'tip', phrase: 'works best under' },
  { a: 'taylor', b: 'tip-mistake', type: 'tip', ctrl: [-9.5, 3.0, -0.4] },
  { a: 'maslow', b: 'tip-5s', type: 'tip' },
  { a: 'm4', b: 'tip-esteem', type: 'tip', ctrl: [2.8, 3.4, -1.2] }
];

/* ═══════════════ PAGE SHELL ═══════════════ */
const App = (() => {
  const $ = (s) => document.querySelector(s);
  const byId = Object.fromEntries(NODES.map(n => [n.id, n]));
  const adj = {};
  NODES.forEach(n => adj[n.id] = new Set());
  EDGES.forEach(e => { adj[e.a].add(e.b); adj[e.b].add(e.a); });
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  const colorOf = n => n.kind === 'tip' ? 'var(--tip)' : n.theory ? THEORY[n.theory].css : 'var(--chalk)';
  const app = { byId, adj, map: null, selected: null, tips: true };

  /* Notes panel */
  const notes = $('#notes');
  function openNotes(id, viaKeyboard) {
    const n = byId[id];
    notes.style.setProperty('--c', colorOf(n));
    const th = n.theory ? THEORY[n.theory] : null;
    $('#notesTheory').innerHTML = th
      ? `<b style="--c:${th.css}">${th.name}</b>, ${th.title.toLowerCase()}${n.kind === 'tip' ? ' (exam tip)' : ''}`
      : 'The question the map answers';
    $('#notesTitle').textContent = n.kind === 'level' ? `${n.level}. ${n.label}` : n.label;
    $('#notesBody').innerHTML = n.body;
    const links = [...adj[id]].map(k => byId[k]).filter(m => app.tips || !m.tip);
    const edgeOf = m => EDGES.find(e => (e.a === id && e.b === m.id) || (e.b === id && e.a === m.id));
    $('#notesLinks').innerHTML = links.length ? '<h3>Connected ideas</h3>' + links.map(m => {
      const e = edgeOf(m);
      return `<button type="button" data-go="${m.id}"><span class="sw" style="--c:${colorOf(m)}"></span>${m.label}${e && e.type === 'cross' ? `<em>${e.phrase}</em>` : ''}</button>`;
    }).join('') : '';
    notes.classList.add('open');
    notes.removeAttribute('inert');
    notes.scrollTop = 0;
    if (viaKeyboard) $('#notesTitle').focus({ preventScroll: true });
  }
  app.notesOpen = () => notes.classList.contains('open');
  app.select = (id, viaKeyboard) => {
    app.selected = id;
    if (id) openNotes(id, viaKeyboard);
    else { notes.classList.remove('open'); notes.setAttribute('inert', ''); }
    document.querySelectorAll('.nl').forEach(b => b.classList.toggle('is-sel', b.dataset.id === id));
    if (id) setViewButtons(byId[id].kind === 'core' ? '' : byId[id].theory);
    app.map && app.map.onSelect(id);
  };
  $('#notesClose').addEventListener('click', () => app.select(null));
  $('#notesLinks').addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (b) app.select(b.dataset.go, e.detail === 0); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && app.notesOpen()) app.select(null); });

  /* View buttons */
  function setViewButtons(t) {
    document.querySelectorAll('[data-focus]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.focus === (t || ''))));
  }
  app.setViewButtons = setViewButtons;
  document.querySelectorAll('[data-focus]').forEach(b => b.addEventListener('click', () => {
    const t = b.dataset.focus || null;
    app.select(t);
    setViewButtons(t);
    app.map && app.map.focus(t);
  }));

  /* Node labels (positioned each frame by the 3D module) */
  const labelsEl = $('#labels');
  NODES.forEach(n => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = `nl k-${n.kind}${n.labelAt === 'left' ? ' at-left' : ''}`;
    b.dataset.id = n.id;
    if (n.tip) b.dataset.tipNode = '';
    b.style.setProperty('--c', colorOf(n));
    b.innerHTML = `<span class="t">${n.label}</span>${n.sub ? `<span class="s">${n.sub}</span>` : ''}`;
    b.setAttribute('aria-label', `${n.label}${n.theory ? ', ' + THEORY[n.theory].name : ''}. Open notes`);
    b.addEventListener('click', e => app.select(n.id, e.detail === 0));
    b.addEventListener('pointerenter', () => app.map && app.map.hover(n.id));
    b.addEventListener('pointerleave', () => app.map && app.map.hover(null));
    b.addEventListener('focus', () => app.map && app.map.hover(n.id));
    b.addEventListener('blur', () => app.map && app.map.hover(null));
    labelsEl.appendChild(b);
  });

  /* Plain list when 3D is unavailable */
  app.mapFallback = (reason) => {
    $('#stage').classList.add('is-fallback');
    $('#mapLoading').remove();
    const groups = ['taylor', 'maslow', 'herzberg'].map(t => `<div style="--c:${THEORY[t].css}"><h3>${THEORY[t].name}</h3>${
      NODES.filter(n => n.theory === t).map(n => `<button type="button" data-go="${n.id}" ${n.tip ? 'data-tip-node' : ''}>${n.kind === 'level' ? n.level + '. ' : ''}${n.label}</button>`).join('')}</div>`).join('');
    $('#fallback').innerHTML = `<p class="note">${reason || 'This device can’t draw the 3D map, so here is the same map as a list.'} Select any idea to read its notes.</p>${groups}`;
    $('#fallback').addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (b) app.select(b.dataset.go, e.detail === 0); });
    setTips(app.tips);
  };

  /* Exam tips layer */
  const tipsBtn = $('#tipsToggle');
  function setTips(on) {
    app.tips = on;
    document.body.classList.toggle('tips-on', on);
    tipsBtn.setAttribute('aria-checked', String(on));
    document.querySelectorAll('[data-tip-node]').forEach(b => { b.tabIndex = on ? 0 : -1; b.style.display = on ? '' : 'none'; });
    if (!on && app.selected && byId[app.selected].tip) app.select(null);
    app.map && app.map.setTips(on);
    store.set('mtm-tips', on ? '1' : '0');
  }
  tipsBtn.addEventListener('click', () => setTips(!app.tips));
  setTips(store.get('mtm-tips') !== '0');

  return app;
})();
</script>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js" } }
</script>
<script type="module">
/* ═══════════════ 3D CONCEPT MAP ═══════════════ */
const stage = document.getElementById('stage');
const canvas = document.getElementById('mapCanvas');
const loading = document.getElementById('mapLoading');
const drawerEl = document.getElementById('notes');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

let THREE;
try { THREE = await import('three'); }
catch (e) { App.mapFallback('The 3D library could not load (are you offline?), so here is the same map as a list.'); }

if (THREE) {
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
  } catch (e) { renderer = null; }
  if (!renderer) App.mapFallback();
  else buildMap(renderer);
}

function buildMap(renderer) {
  const { byId, adj } = App;
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 400);
  const root = new THREE.Group();
  scene.add(root);

  scene.add(new THREE.AmbientLight(0xdfe8f0, 1.0));
  const key = new THREE.DirectionalLight(0xffffff, 1.4); key.position.set(6, 10, 14); scene.add(key);

  const col = id => {
    const n = byId[id];
    if (n.kind === 'tip') return new THREE.Color('#ffd76a');
    if (n.kind === 'core') return new THREE.Color('#e9f0f5');
    return new THREE.Color(THEORY[n.theory].color);
  };

  /* Glow texture */
  const gc = document.createElement('canvas'); gc.width = gc.height = 128;
  const g = gc.getContext('2d');
  const grd = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  grd.addColorStop(0, 'rgba(255,255,255,1)'); grd.addColorStop(0.18, 'rgba(255,255,255,.55)');
  grd.addColorStop(0.45, 'rgba(255,255,255,.12)'); grd.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grd; g.fillRect(0, 0, 128, 128);
  const glowTex = new THREE.CanvasTexture(gc);

  /* ── Maslow pyramid (5 tiers) ── */
  const PY = { x: 0, z: -2, y0: -3.45, h: 1.0, gap: 0.14, apex: 2.95, R0: 4.25 };
  const rAt = y => PY.R0 * (PY.apex - y) / (PY.apex - PY.y0);
  const pyramid = new THREE.Group(); pyramid.position.set(PY.x, 0, PY.z); root.add(pyramid);
  const slabs = [];
  const mBase = new THREE.Color(THEORY.maslow.color);
  LEVELS.forEach((L, i) => {
    const yb = PY.y0 + i * (PY.h + PY.gap), yt = yb + PY.h, yc = (yb + yt) / 2;
    const geo = new THREE.CylinderGeometry(rAt(yt), rAt(yb), PY.h, 4, 1);
    const c = mBase.clone().offsetHSL(0, 0, i * 0.035);
    const mat = new THREE.MeshStandardMaterial({ color: c, emissive: c, emissiveIntensity: 0.28, transparent: true, opacity: 0.2, roughness: 0.35, metalness: 0.1, depthWrite: false, side: THREE.DoubleSide });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.rotation.y = Math.PI / 4;
    const edges = new THREE.LineSegments(new THREE.EdgesGeometry(geo), new THREE.LineBasicMaterial({ color: c, transparent: true, opacity: 0.85 }));
    edges.rotation.y = Math.PI / 4;
    const tier = new THREE.Group(); tier.add(mesh, edges); tier.position.y = yc;
    pyramid.add(tier);
    mesh.userData.id = L.id;
    const rMid = rAt(yc);
    byId[L.id].pos = [PY.x, yc, PY.z + rMid * Math.SQRT1_2 + 0.02];
    byId[L.id].labelAt = 'center';
    slabs.push({ id: L.id, tier, mesh, edges, mat, yc, lift: 0 });
  });
  /* Brackets for lower / higher order */
  const bracket = (y1, y2, x, color) => {
    const pts = [new THREE.Vector3(x - 0.3, y1, 0), new THREE.Vector3(x, y1, 0), new THREE.Vector3(x, y2, 0), new THREE.Vector3(x - 0.3, y2, 0)];
    const l = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.6 }));
    pyramid.add(l); return l;
  };
  const tierTop = i => PY.y0 + i * (PY.h + PY.gap) + PY.h;
  const brackets = [
    { line: bracket(PY.y0, tierTop(2), 3.55, THEORY.maslow.color), id: 'm-lower' },
    { line: bracket(tierTop(2) + PY.gap, tierTop(4), 3.55, THEORY.maslow.color), id: 'm-higher' }
  ];

  /* ── Nodes ── */
  const nodeObjs = {};
  const pickables = slabs.map(s => s.mesh);
  const sphereGeo = new THREE.SphereGeometry(1, 28, 18);
  const diamondGeo = new THREE.OctahedronGeometry(1, 0);
  NODES.forEach(n => {
    const o = { n, base: new THREE.Vector3(...n.pos), group: new THREE.Group(), appear: 0, dim: 1, dimT: 1 };
    o.group.position.copy(o.base);
    if (n.kind !== 'level') {
      const r = n.kind === 'core' ? 0.42 : n.kind === 'theory' ? 0.36 : n.kind === 'tip' ? 0.17 : 0.15;
      const c = col(n.id);
      const mat = new THREE.MeshBasicMaterial({ color: c, transparent: true });
      const m = new THREE.Mesh(n.kind === 'tip' ? diamondGeo : sphereGeo, mat);
      m.scale.setScalar(r); m.userData.id = n.id;
      const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: c, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false }));
      glow.scale.setScalar(r * (n.kind === 'idea' ? 9 : 8));
      o.group.add(glow, m);
      o.mesh = m; o.glow = glow; o.r = r;
      if (n.kind === 'theory' || n.kind === 'core') {
        const circle = (rad) => {
          const m2 = new THREE.Mesh(new THREE.RingGeometry(rad, rad + 0.035, 72), new THREE.MeshBasicMaterial({ color: c, transparent: true, depthWrite: false, side: THREE.DoubleSide }));
          o.group.add(m2); return m2;
        };
        o.ring = circle(r * 1.9);
        if (n.kind === 'core') o.ring2 = circle(r * 2.6);
      }
      root.add(o.group);
      pickables.push(m);
    }
    nodeObjs[n.id] = o;
  });

  /* intro delays: grows outward from the focus question */
  const depthDelay = { core: 0.15, theory: 0.65, idea: 1.15, level: 0.9, tip: 2.3 };
  let ideaCount = 0;
  NODES.forEach(n => {
    const o = nodeObjs[n.id];
    o.delay = depthDelay[n.kind] + (n.kind === 'idea' ? (ideaCount++) * 0.05 : 0) + (n.kind === 'level' ? n.level * 0.13 : 0) + (n.kind === 'theory' ? ({ taylor: 0, maslow: 0.1, herzberg: 0.2 })[n.theory] : 0);
  });

  /* ── Edges ── */
  const edgeObjs = [];
  const flowPts = [];
  EDGES.forEach(e => {
    if (e.type === 'hidden') return;
    const A = new THREE.Vector3(...byId[e.a].pos), B = new THREE.Vector3(...byId[e.b].pos);
    const mid = A.clone().add(B).multiplyScalar(0.5);
    const ctrl = e.ctrl ? new THREE.Vector3(...e.ctrl) : mid.clone().add(new THREE.Vector3(0, 0, 0.9));
    const curve = new THREE.QuadraticBezierCurve3(A, ctrl, B);
    const cA = col(e.a), cB = col(e.b);
    const color = e.type === 'cross' ? new THREE.Color('#e9f0f5') : e.type === 'tip' ? new THREE.Color('#ffd76a') : (byId[e.a].kind === 'core' ? cB : cA);
    let obj, mat, count;
    if (e.type === 'tree') {
      const geo = new THREE.TubeGeometry(curve, 64, byId[e.a].kind === 'core' ? 0.045 : 0.028, 6, false);
      mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.55, blending: THREE.AdditiveBlending, depthWrite: false });
      obj = new THREE.Mesh(geo, mat);
      count = geo.index.count;
    } else {
      const geo = new THREE.BufferGeometry().setFromPoints(curve.getPoints(90));
      mat = new THREE.LineDashedMaterial({ color, dashSize: 0.28, gapSize: 0.2, transparent: true, opacity: 0.7 });
      obj = new THREE.Line(geo, mat);
      obj.computeLineDistances();
      count = 91;
    }
    root.add(obj);
    const delay = e.type === 'cross' ? 2.0 : e.type === 'tip' ? 2.3 : Math.min(nodeObjs[e.a].delay, nodeObjs[e.b].delay) + 0.1;
    const eo = { e, curve, obj, mat, count, color, delay, baseOpacity: mat.opacity, op: mat.opacity, tip: e.type === 'tip' };
    if (e.phrase) {
      const ph = document.createElement('span'); ph.className = 'ph'; ph.textContent = e.phrase;
      document.getElementById('labels').appendChild(ph);
      eo.ph = ph; eo.phPos = curve.getPoint(0.5);
    }
    const nFlow = e.type === 'cross' ? 3 : e.type === 'tip' ? 1 : 2;
    for (let i = 0; i < nFlow; i++) flowPts.push({ eo, off: i / nFlow, speed: e.type === 'cross' ? 0.09 : 0.14 });
    edgeObjs.push(eo);
  });

  /* Flow particles travelling along links */
  const fGeo = new THREE.BufferGeometry();
  const fPos = new Float32Array(flowPts.length * 3), fCol = new Float32Array(flowPts.length * 3);
  fGeo.setAttribute('position', new THREE.BufferAttribute(fPos, 3));
  fGeo.setAttribute('color', new THREE.BufferAttribute(fCol, 3));
  const flow = new THREE.Points(fGeo, new THREE.PointsMaterial({ size: 0.42, map: glowTex, vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
  root.add(flow);

  /* Drafting grid behind the drawing: 1-unit squares, heavier line every 5 */
  const grid = new THREE.Group(); grid.position.z = -7;
  const gridLayer = (div, opacity) => {
    const gh = new THREE.GridHelper(80, div, 0xa9bed2, 0xa9bed2);
    gh.rotation.x = Math.PI / 2;
    gh.material.transparent = true; gh.material.opacity = opacity; gh.material.depthWrite = false;
    grid.add(gh); return gh;
  };
  const gridLayers = [gridLayer(80, 0.06), gridLayer(16, 0.13)];
  root.add(grid);

  /* ── Labels ── */
  const labelEls = {};
  document.querySelectorAll('.nl').forEach(b => labelEls[b.dataset.id] = b);

  /* ── State ── */
  const S = {
    hover: null, selected: null, focus: null, tips: App.tips,
    yaw: 0, pitch: 0, yawT: 0, pitchT: 0, dragging: false,
    camPos: new THREE.Vector3(0, 0.3, 40), camLook: new THREE.Vector3(0, 0.3, 0),
    camPosT: new THREE.Vector3(), camLookT: new THREE.Vector3(),
    w: 1, h: 1, compact: false, t: 0, intro: reduceMotion ? 99 : 0, running: false, visible: true
  };

  const clusterBox = {};
  ['taylor', 'maslow', 'herzberg'].forEach(t => {
    const box = new THREE.Box3();
    NODES.filter(n => n.theory === t).forEach(n => box.expandByPoint(new THREE.Vector3(...n.pos)));
    if (t === 'maslow') box.expandByPoint(new THREE.Vector3(-3, PY.y0, PY.z)).expandByPoint(new THREE.Vector3(3, PY.y0, PY.z));
    clusterBox[t] = box;
  });
  const overviewBox = new THREE.Box3(new THREE.Vector3(-17.4, -6.4, 0), new THREE.Vector3(14.8, 8.4, 0));
  const compactBox = new THREE.Box3(new THREE.Vector3(-15.6, -2.6, 0), new THREE.Vector3(15.6, 8.2, 0));

  function computeCamera() {
    const box = S.focus ? clusterBox[S.focus].clone() : S.compact ? compactBox.clone() : overviewBox.clone();
    if (S.focus && !S.tips) {
      box.makeEmpty();
      NODES.filter(n => n.theory === S.focus && !n.tip).forEach(n => box.expandByPoint(new THREE.Vector3(...n.pos)));
      if (S.focus === 'maslow') box.expandByPoint(new THREE.Vector3(-3, PY.y0, PY.z)).expandByPoint(new THREE.Vector3(3, PY.y0, PY.z));
    }
    const c = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    const padX = S.focus ? 2.4 : 0.4, padY = S.focus ? 1.8 : 0.2;
    const halfW = size.x / 2 + padX, halfH = size.y / 2 + padY;
    // area not covered by the drawer
    let aw = S.w, ah = S.h, ox = 0, oy = 0;
    const open = App.notesOpen();
    if (open && !S.compact) { const dw = Math.min(400, S.w - 32) + 32; aw = S.w - dw; ox = -dw / 2; }
    if (open && S.compact) { const dh = Math.min(S.h * 0.5, drawerEl.scrollHeight) + 8; ah = S.h - dh; oy = -dh / 2; }
    // map-foot overlay at the bottom
    const footH = 0; ah -= footH; oy -= footH / 2;
    const topPad = S.compact ? 0 : 96; ah -= topPad; oy += topPad / 2;
    const t = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
    let d = Math.max(halfH * S.h / (ah * t), halfW * S.h / (aw * t));
    d = Math.max(d, 9);
    const ppu = S.h / (2 * d * t);
    S.camLookT.set(c.x - ox / ppu, c.y + oy / ppu, c.z);
    S.camPosT.set(S.camLookT.x, S.camLookT.y, c.z + d);
  }

  function resize() {
    const r = stage.getBoundingClientRect();
    S.w = Math.max(1, r.width); S.h = Math.max(1, r.height);
    S.compact = S.w < 760;
    renderer.setPixelRatio(Math.min(devicePixelRatio, S.compact ? 1.5 : 2));
    renderer.setSize(S.w, S.h, false);
    camera.aspect = S.w / S.h; camera.updateProjectionMatrix();
    computeCamera();
    if (S.t === 0) { S.camPos.copy(S.camPosT).add(new THREE.Vector3(0, -2, reduceMotion ? 0 : 14)); S.camLook.copy(S.camLookT); }
  }
  new ResizeObserver(resize).observe(stage);

  /* ── Public API used by the page ── */
  App.map = {
    hover(id) { S.hover = id; },
    onSelect(id) {
      S.selected = id;
      const n = id && byId[id];
      if (n) S.focus = n.kind === 'core' ? null : n.theory;
      if (n) { S.yawT = 0; S.pitchT = 0; }
      computeCamera();
    },
    focus(t) { S.focus = t; S.yawT = 0; S.pitchT = 0; computeCamera(); },
    setTips(on) { S.tips = on; computeCamera(); }
  };

  /* ── Pointer: drag to orbit, hover / click to pick ── */
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  let down = null, moved = false;
  function pick(ev) {
    const r = canvas.getBoundingClientRect();
    ndc.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    const hits = ray.intersectObjects(pickables.filter(m => {
      const n = byId[m.userData.id]; return S.tips || !n.tip;
    }), false);
    if (!hits.length) return null;
    // a node sphere wins over the pyramid surface it may sit in front of
    const sphere = hits.find(h => byId[h.object.userData.id].kind !== 'level');
    return (sphere || hits[0]).object.userData.id;
  }
  canvas.addEventListener('pointerdown', ev => {
    down = { x: ev.clientX, y: ev.clientY, yaw: S.yawT, pitch: S.pitchT, type: ev.pointerType }; moved = false;
  });
  window.addEventListener('pointermove', ev => {
    if (down) {
      const dx = ev.clientX - down.x, dy = ev.clientY - down.y;
      if (!moved && Math.hypot(dx, dy) > 6) { moved = true; S.dragging = true; canvas.classList.add('dragging'); }
      if (moved) {
        S.yawT = THREE.MathUtils.clamp(down.yaw + dx * 0.004, -0.75, 0.75);
        if (down.type === 'mouse') S.pitchT = THREE.MathUtils.clamp(down.pitch + dy * 0.003, -0.32, 0.32);
      }
      return;
    }
    if (ev.target === canvas && ev.pointerType === 'mouse') {
      const id = pick(ev);
      if (id !== S.hoverPick) { S.hoverPick = id; S.hover = id; canvas.classList.toggle('pointing', !!id); }
    }
  });
  const endDrag = ev => {
    if (!down) return;
    if (!moved && ev.type === 'pointerup' && ev.target === canvas) {
      const id = pick(ev);
      App.select(id || null);
      if (!id) { S.focus = null; computeCamera(); App.setViewButtons(''); }
    }
    down = null; S.dragging = false; canvas.classList.remove('dragging');
  };
  window.addEventListener('pointerup', endDrag);
  window.addEventListener('pointercancel', endDrag);
  canvas.addEventListener('pointerleave', () => { if (S.hoverPick) { S.hoverPick = null; S.hover = null; canvas.classList.remove('pointing'); } });

  /* ── Render loop ── */
  const tmp = new THREE.Vector3();
  const ease = x => 1 - Math.pow(1 - x, 3);
  const clamp01 = x => Math.min(1, Math.max(0, x));
  let last = null; const introStart = performance.now();

  function project(v) {
    tmp.copy(v).applyMatrix4(root.matrixWorld).project(camera);
    return { x: (tmp.x * 0.5 + 0.5) * S.w, y: (-tmp.y * 0.5 + 0.5) * S.h, z: tmp.z };
  }

  function frame(now) {
    if (!S.visible) { S.running = false; return; }
    const dt = last === null ? 0 : Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
    S.t += dt; S.intro = reduceMotion ? 99 : (performance.now() - introStart) / 1000;
    const k = reduceMotion ? 1 : 1 - Math.pow(0.0025, dt);   // camera smoothing
    const ko = reduceMotion ? 1 : 1 - Math.pow(0.02, dt);

    const sway = reduceMotion || S.dragging ? 0 : Math.sin(S.t * 0.16) * (S.focus ? 0.035 : 0.13);
    const swayP = reduceMotion || S.dragging ? 0 : Math.sin(S.t * 0.11 + 1) * (S.focus ? 0.01 : 0.04);
    S.yaw += (S.yawT + sway - S.yaw) * ko;
    S.pitch += (S.pitchT + swayP - S.pitch) * ko;
    root.rotation.set(S.pitch, S.yaw, 0);
    root.updateMatrixWorld();

    S.camPos.lerp(S.camPosT, k); S.camLook.lerp(S.camLookT, k);
    camera.position.copy(S.camPos); camera.lookAt(S.camLook); camera.updateMatrixWorld();

    const hl = S.hover || S.selected;
    const related = hl ? adj[hl] : null;
    const isOn = id => !hl || id === hl || related.has(id);

    /* nodes */
    NODES.forEach(n => {
      const o = nodeObjs[n.id];
      const vis = S.tips || !n.tip;
      o.appear = clamp01((S.intro - o.delay) / 0.7);
      let dimT = isOn(n.id) ? 1 : 0.22;
      if (S.focus && n.theory !== S.focus && n.kind !== 'core') dimT *= 0.45;
      o.dim += (dimT - o.dim) * ko;
      const a = vis ? o.appear : 0;
      if (o.mesh) {
        o.group.visible = a > 0.001;
        const pulse = n.id === hl ? 1.25 : 1;
        o.group.scale.setScalar(Math.max(0.0001, ease(a)) * pulse);
        o.mesh.material.opacity = 0.35 + 0.65 * o.dim;
        o.glow.material.opacity = (0.25 + 0.75 * o.dim) * a;
        if (o.ring) o.ring.material.opacity = 0.85 * o.dim * a;
        if (o.ring2) o.ring2.material.opacity = 0.4 * o.dim * a;
        if (!reduceMotion) o.group.position.y = o.base.y + Math.sin(S.t * 0.8 + o.base.x) * 0.06;
      }
    });
    /* pyramid tiers */
    slabs.forEach((s, i) => {
      const o = nodeObjs[s.id];
      const active = s.id === hl;
      s.lift += ((active ? 0.55 : 0) - s.lift) * ko;
      const a = ease(o.appear);
      s.tier.position.y = s.yc - (1 - a) * 1.2;
      s.tier.position.z = s.lift;
      s.mat.opacity = (0.12 + 0.2 * o.dim + (active ? 0.25 : 0)) * a;
      s.mat.emissiveIntensity = active ? 0.7 : 0.28;
      s.edges.material.opacity = (0.25 + 0.65 * o.dim) * a;
      byId[s.id].pos[1] = s.tier.position.y; byId[s.id].pos[2] = PY.z + rAt(s.yc) * Math.SQRT1_2 + 0.02 + s.lift;
      if (!reduceMotion) pyramid.rotation.y = 0;
    });
    brackets.forEach(b => { b.line.material.opacity = 0.6 * nodeObjs[b.id].dim * ease(clamp01((S.intro - 1.4) / 0.6)); });

    /* edges */
    edgeObjs.forEach(eo => {
      const vis = S.tips || !eo.tip;
      const p = vis ? clamp01((S.intro - eo.delay) / 0.75) : 0;
      eo.obj.visible = p > 0;
      eo.obj.geometry.setDrawRange(0, Math.floor(eo.count * ease(p) / (eo.e.type === 'tree' ? 3 : 1)) * (eo.e.type === 'tree' ? 3 : 1));
      const on = !hl || eo.e.a === hl || eo.e.b === hl;
      let target = !hl ? eo.baseOpacity : on ? Math.min(1, eo.baseOpacity + 0.4) : 0.08;
      if (S.focus && !hl) {
        const ta = byId[eo.e.a].theory, tb = byId[eo.e.b].theory;
        if (ta !== S.focus && tb !== S.focus) target *= 0.35;
      }
      eo.op += (target - eo.op) * ko;
      eo.mat.opacity = eo.op;
      eo.p = p; eo.on = on;
    });

    /* flow particles */
    flowPts.forEach((f, i) => {
      const eo = f.eo;
      const visible = eo.obj.visible && eo.p >= 1;
      const u = reduceMotion ? f.off + 0.5 / 3 : (f.off + S.t * f.speed) % 1;
      const pt = eo.curve.getPoint(u);
      fPos[i * 3] = pt.x; fPos[i * 3 + 1] = pt.y; fPos[i * 3 + 2] = pt.z;
      const b = visible ? Math.max(0.08, eo.op * 1.3) * Math.sin(Math.PI * u) : 0;
      fCol[i * 3] = eo.color.r * b; fCol[i * 3 + 1] = eo.color.g * b; fCol[i * 3 + 2] = eo.color.b * b;
    });
    fGeo.attributes.position.needsUpdate = true; fGeo.attributes.color.needsUpdate = true;

    gridLayers.forEach(g => g.visible = S.intro > 0);

    /* HTML labels */
    NODES.forEach(n => {
      const el = labelEls[n.id]; if (!el) return;
      const o = nodeObjs[n.id];
      const pos = o.mesh ? new THREE.Vector3(o.base.x, o.group.position.y, o.base.z) : new THREE.Vector3(...n.pos);
      const p = project(pos);
      let a = (S.tips || !n.tip) ? clamp01((S.intro - o.delay - 0.2) / 0.5) : 0;
      a *= o.dim < 0.5 ? 0.35 + o.dim * 0.65 : o.dim;
      if ((n.kind === 'idea' || n.kind === 'tip' || n.kind === 'level') && S.focus && S.focus !== n.theory) a = 0;
      if (S.compact && (n.kind === 'idea' || n.kind === 'tip' || n.kind === 'level') && S.focus !== n.theory && S.selected !== n.id) a = 0;
      if (p.z > 1) a = 0;
      const where = n.labelAt || 'below';
      const scale = camera.position.z - pos.z;
      const off = o.r ? Math.max(10, o.r * 2.4 * (S.h / (2 * scale * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2))))) : 0;
      const tx = where === 'left' ? `calc(-100% - ${off * 1.4}px)` : '-50%';
      const ty = where === 'center' || where === 'left' ? '-50%' : where === 'above' ? `calc(-100% - ${off}px)` : `${off}px`;
      el.style.transform = `translate3d(${p.x.toFixed(1)}px, ${p.y.toFixed(1)}px, 0) translate(${tx}, ${ty})`;
      el.style.opacity = a.toFixed(3);
      el.style.pointerEvents = a > 0.2 ? 'auto' : 'none';
      el.classList.toggle('is-hot', n.id === hl);
    });
    edgeObjs.forEach(eo => {
      if (!eo.ph) return;
      const p = project(eo.phPos);
      let a = eo.p >= 1 ? 1 : 0;
      a *= !hl ? 0.85 : eo.on ? 1 : 0.15;
      if (S.compact && !(S.focus && (byId[eo.e.a].theory === S.focus || byId[eo.e.b].theory === S.focus))) a = 0;
      eo.ph.style.transform = `translate3d(${p.x.toFixed(1)}px, ${p.y.toFixed(1)}px, 0) translate(-50%, -50%)`;
      eo.ph.style.opacity = a.toFixed(3);
    });

    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }

  function start() { if (!S.running && S.visible) { S.running = true; last = null; requestAnimationFrame(frame); } }
  new IntersectionObserver(([en]) => { S.visible = en.isIntersecting && !document.hidden; start(); }, { threshold: 0 }).observe(stage);
  document.addEventListener('visibilitychange', () => { S.visible = !document.hidden; start(); });

  resize();
  loading.remove();
  start();
  if (App.selected) App.map.onSelect(App.selected);
}
</script>
</body>
</html>
